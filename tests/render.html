<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Blasta offline render test</title></head>
<body><pre id="log"></pre>
<script type="module">
import { builtinFMBank } from '../js/fmbank.js';
import { demoSong } from '../js/demo.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
window.results = null;

function burn(buf) {
  return new Promise((res, rej) => {
    const w = new Worker('../js/rom-worker.js', { type: 'module' });
    w.onmessage = (e) => { if (e.data.progress !== undefined) return; e.data.ok ? res(e.data) : rej(new Error(e.data.error)); };
    w.postMessage({ id: 1, buf, budgets: ['awe', 'live'] }, [buf]);
  });
}

async function renderEra(era, banks, seconds, startAt = 0) {
  const sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.round(seconds * sr), sr);
  await ctx.audioWorklet.addModule('../js/blasta-worklet.js');
  const node = new AudioWorkletNode(ctx, 'blasta', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  node.connect(ctx.destination);
  const stats = [];
  node.port.onmessage = (e) => { if (e.data.t === 'stat') stats.push(e.data); else if (e.data.t === 'pong') node._pong && node._pong(); };
  node.port.postMessage({ t: 'fmbank', bank: builtinFMBank() });
  if (era >= 1.01) node.port.postMessage({ t: 'sfbank', core: 2, bank: structuredClone(banks.awe) });
  if (era >= 2.01) node.port.postMessage({ t: 'sfbank', core: 3, bank: structuredClone(banks.live) });
  node.port.postMessage({ t: 'era', v: era });
  const song = demoSong();
  const ev = [];
  for (const e of song.events) {
    if (e[0] < startAt) { const ty = e[1] & 0xF0; if (ty === 0xB0 || ty === 0xC0) ev.push([0, e[1], e[2], e[3]]); continue; }
    ev.push([Math.round((e[0] - startAt) * sr) + 64, e[1], e[2], e[3]]);
  }
  node.port.postMessage({ t: 'ev', ev });
  await new Promise(r => { node._pong = r; node.port.postMessage({ t: 'ping' }); });
  const t0 = performance.now();
  const buf = await ctx.startRendering();
  const ms = performance.now() - t0;
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let pk = 0, ss = 0, nan = 0, clip = 0, sd = 0;
  for (let i = 0; i < L.length; i++) {
    const l = L[i], r = R[i];
    if (l !== l || r !== r) { nan++; continue; }
    pk = Math.max(pk, Math.abs(l), Math.abs(r)); ss += l * l + r * r; sd += (l - r) * (l - r);
    if (Math.abs(l) >= 0.999 || Math.abs(r) >= 0.999) clip++;
  }
  const maxV = [0, 0, 0, 0];
  for (const s of stats) s.voices.forEach((v, i) => { if (v > maxV[i]) maxV[i] = v; });
  return { era, ms: Math.round(ms), rt: +(seconds * 1000 / ms).toFixed(1), peak: +pk.toFixed(3), rmsDb: +(10 * Math.log10(ss / (2 * L.length) + 1e-12)).toFixed(1),
    stereoDiffDb: +(10 * Math.log10(sd / L.length + 1e-12)).toFixed(1), nan, clip, maxVoices: maxV, L, R, sr };
}

function wav(L, R, sr) {
  const n = L.length, b = new ArrayBuffer(44 + n * 4), d = new DataView(b);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
  d.setUint32(24, sr, true); d.setUint32(28, sr * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); ws(36, 'data'); d.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); d.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  return b;
}

window.patchTest = async () => {
  const r = await fetch('../soundfonts/GeneralUser-GS.sf2');
  const banks = (await burn(await r.arrayBuffer())).banks;
  const sr = 44100, slot = 0.6, res = {};
  for (const era of [0, 1, 2, 3]) {
    const n = 128 + 47;
    const ctx = new OfflineAudioContext(2, Math.round(n * slot * sr), sr);
    await ctx.audioWorklet.addModule('../js/blasta-worklet.js');
    const node = new AudioWorkletNode(ctx, 'blasta', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    node.connect(ctx.destination);
    node.port.onmessage = (e) => { if (e.data.t === 'pong') node._pong(); };
    node.port.postMessage({ t: 'fmbank', bank: builtinFMBank() });
    node.port.postMessage({ t: 'sfbank', core: 2, bank: structuredClone(banks.awe) });
    node.port.postMessage({ t: 'sfbank', core: 3, bank: structuredClone(banks.live) });
    node.port.postMessage({ t: 'era', v: era });
    const ev = [];
    for (let p = 0; p < 128; p++) {
      const f = Math.round(p * slot * sr) + 64, note = (p >= 32 && p < 40) || p === 43 || p === 58 ? 40 : 60;
      ev.push([f, 0xC0, p, 0], [f + 1, 0x90, note, 100], [f + Math.round(0.4 * sr), 0x80, note, 0]);
    }
    for (let k = 0; k < 47; k++) {
      const f = Math.round((128 + k) * slot * sr) + 64;
      ev.push([f, 0x99, 35 + k, 100], [f + Math.round(0.3 * sr), 0x89, 35 + k, 0]);
    }
    node.port.postMessage({ t: 'ev', ev });
    await new Promise(r => { node._pong = r; node.port.postMessage({ t: 'ping' }); });
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    const db = [];
    for (let s = 0; s < n; s++) {
      const a = Math.round(s * slot * sr), b = Math.round((s * slot + 0.45) * sr);
      let ss = 0, pk = 0;
      for (let i = a; i < b; i++) { ss += L[i] * L[i] + R[i] * R[i]; pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i])); }
      db.push([+(10 * Math.log10(ss / (2 * (b - a)) + 1e-12)).toFixed(1), +pk.toFixed(2)]);
    }
    res[era] = db;
  }
  return res;
};

window.run = async (seconds = 20, startAt = 8) => {
  const r = await fetch('../soundfonts/GeneralUser-GS.sf2');
  const t = performance.now();
  const banks = (await burn(await r.arrayBuffer())).banks;
  log('burn ms ' + Math.round(performance.now() - t));
  const out = [];
  for (const era of [0, 1, 1.5, 2, 2.5, 3]) {
    const res = await renderEra(era, banks, seconds, startAt);
    const { L, R, sr, ...info } = res;
    log(JSON.stringify(info));
    window['wav_' + String(era).replace('.', '_')] = wav(L, R, sr);
    out.push(info);
  }
  window.results = out;
  return out;
};
</script>
</body></html>
